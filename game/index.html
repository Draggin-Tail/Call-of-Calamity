<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Call of Calamity</title>
<style>
:root{--bg:#121c26;--panel:#1b2a38;--t1:#27394a;--t2:#2c4054;--rock:#0d141b;--ink:#e9e4d3;--dim:#8da1af;--gold:#e2b24c;--ally:#4ea5cc;--foe:#cc6150;--ok:#7cc480;--line:#3a5266}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:10px;display:flex;flex-direction:column;gap:10px}
#top{display:flex;justify-content:space-between;align-items:center}
h1{font:600 18px Palatino,Georgia,serif;margin:0;letter-spacing:.02em}
#obj{font:600 12px system-ui;color:#e2b24c;text-align:center;padding:3px 0 0;min-height:15px}
#bar{display:flex;gap:5px;overflow-x:auto;padding:4px 0 2px 5px}
.chip{flex:0 0 auto;width:36px;height:36px;border-radius:6px;display:grid;place-items:center;font:700 13px Palatino,Georgia,serif;border:2px solid var(--line);background:var(--panel);position:relative}
.chip.P{border-color:var(--ally)}.chip.E{border-color:var(--foe)}
.chip.now{background:var(--gold);color:#1a1405;border-color:var(--gold)}
.chip.again::after{content:"";position:absolute;inset:-5px auto -5px -5px;width:2px;background:var(--gold)}
#cv{display:block;touch-action:pan-x pan-y}
#bwo{position:relative}#bw{position:relative;overflow:auto;max-height:60vh;-webkit-overflow-scrolling:touch}
.vt{position:absolute;top:6px;left:6px;height:30px;min-width:42px;border-radius:15px;border:1px solid var(--line);background:#1b2a38cc;color:var(--ink);font:700 13px system-ui;padding:0 10px;z-index:5}
.zm{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:6px;z-index:5}.zm button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#1b2a38cc;color:var(--ink);font:700 18px system-ui;padding:0}
.rot{position:absolute;bottom:6px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#1b2a38cc;color:var(--ink);font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.rot.l{left:6px}.rot.r{right:6px}
#cards{display:grid;grid-template-columns:1fr 1fr;gap:6px}#cards:empty{display:none}
.uc{display:flex;gap:7px;align-items:stretch;padding:6px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(100deg,#1b2a38,#233a4e);min-width:0;position:relative}
.uc.E{background:linear-gradient(100deg,#2a1c1e,#4a2a2c);border-color:#6a3a38}
.uc.now{box-shadow:0 0 0 2px var(--gold)}.uc.empty{opacity:.5;align-items:center;justify-content:center;color:var(--dim);font-size:12px;text-align:center}
.uc .pt{position:relative;flex:0 0 66px;width:66px;height:66px;border-radius:6px;overflow:hidden;background:#0d141b;align-self:flex-start}
.uc .pt img,.rc .pt img{display:block;width:100%;height:100%;image-rendering:auto}.uc .pt span,.rc .pt span{display:grid;place-items:center;height:100%;font:700 20px Palatino,Georgia,serif}
.uc .lv{position:absolute;left:0;bottom:0;background:#000b;color:var(--ink);font:700 10px system-ui;padding:1px 4px;border-radius:0 5px 0 0}
.uc .ub{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.uc .nm{font:700 14px Palatino,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.uc small{font:11px/1.2 system-ui;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uc .bar{position:relative;height:11px;border-radius:3px;background:#0d141b;overflow:hidden}.uc .bar i{position:absolute;inset:0 auto 0 0;display:block}
.uc .bar span{position:absolute;inset:0;font:700 9px/11px system-ui;padding:0 4px;display:flex;justify-content:space-between;text-shadow:0 1px 1px #000}
.uc .bar.hp i{background:linear-gradient(#7cc480,#3f8a4a)}.uc .bar.hp.lo i{background:linear-gradient(#e0a24c,#b0562a)}.uc .bar.mp i{background:linear-gradient(#7aa8e0,#3f64b0)}.uc .bar.ct i{background:linear-gradient(#e2b24c,#a8802a)}
.uc .stl{font:10px/1.2 system-ui;color:#cdbff0;min-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cards .pred{background:#1b2a38;border:1px solid var(--gold);border-radius:9px;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.pred .hd{font:600 11px system-ui;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}.pred .pr{display:flex;align-items:baseline;gap:8px;font-size:13px}
.pred .pr b{font:700 13px Palatino,Georgia,serif;min-width:70px;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pred b.E{color:#e07d6c}.pred b.P{color:#6fb9dd}
.pred .v{font:700 17px Palatino,Georgia,serif;color:#f0e6c8;min-width:28px;text-align:right}.pred .v.good{color:#9be0a4}.pred small{flex:1;color:var(--dim);font:11px/1.25 system-ui}
.pred .ko{font:700 10px system-ui;font-style:normal;background:#b0392b;color:#fff;border-radius:6px;padding:1px 6px;white-space:nowrap}
button.a.cf{background:var(--ally);color:#06141c;font-weight:700;justify-content:center}button.a.cf.no{background:var(--t2);color:var(--ink)}
.uc .pdm{position:absolute;right:0;top:0;background:#b0392b;color:#fff;font:700 13px Palatino,Georgia,serif;padding:1px 6px;border-radius:0 0 0 6px}
.pred.conf .cost small{color:var(--dim);font-size:11px}
button.a.rep{grid-column:1/-1;border-color:var(--gold);background:#3a3a2a}
#deploy{grid-column:1/-1;display:flex;flex-direction:column;gap:6px}#deploy .hd{display:flex;justify-content:space-between;font:600 13px system-ui;color:var(--dim)}#deploy .hd b{color:var(--gold)}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 1px 6px;-webkit-overflow-scrolling:touch}
.rc{flex:0 0 80px;border-radius:9px;border:1px solid var(--line);background:linear-gradient(#233a4e,#1b2a38);padding:5px;display:flex;flex-direction:column;gap:3px;text-align:left;color:var(--ink);font:inherit;position:relative}
.rc .pt{width:66px;height:66px;border-radius:6px;overflow:hidden;background:#0d141b;position:relative}.rc .pt .tick{position:absolute;right:3px;top:3px;background:var(--ok);color:#06140a;border-radius:9px;font:700 10px system-ui;padding:0 5px}
.rc b{font:700 12px/1.15 Palatino,Georgia,serif;word-break:break-word;min-height:2.3em}.rc small{font:10.5px/1.2 system-ui;color:var(--dim)}
.rc.off{opacity:.62}.rc.off .pt img{filter:grayscale(.6)}.rc.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);opacity:1}
#info{background:var(--panel);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
#who{display:flex;justify-content:space-between;align-items:center;font:600 16px Palatino,Georgia,serif;gap:8px}
#who button.a.tb{width:auto;flex:none;min-height:0;padding:8px 14px;margin:0;white-space:nowrap}
#who small{display:block;font:12px system-ui;color:var(--dim)}
.pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--gold)}.pip.on{background:var(--gold)}
.pip.b{border-color:var(--ally)}.pip.b.on{background:var(--ally)}
#acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button.a{background:var(--t2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;display:flex;justify-content:space-between;align-items:center;gap:6px;min-height:44px;text-align:left}
button.a small{display:block;color:var(--dim);font-size:11px;line-height:1.2}
button.a b{background:var(--gold);color:#1a1405;border-radius:10px;padding:0 8px;font-size:13px}
button.a.sel{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
button.a.dis{opacity:.35}
#cv,.rot,button.a,.chip,.pips{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#tip{position:fixed;display:none;z-index:30;pointer-events:none;background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:9px 12px;font-size:13px;line-height:1.4;white-space:pre-line;width:max-content;max-width:min(340px,calc(100vw - 16px));box-shadow:0 4px 16px #000a}
button.end{grid-column:1/-1;background:var(--ally);color:#06141c;font-weight:700;justify-content:center}
button.sm{min-height:0;padding:4px 10px}
#hint{color:var(--dim);font-size:13px;min-height:1.4em}

#logp{position:fixed;inset:0;background:#000d;display:none;z-index:50}
#logp>div{background:var(--panel);width:100%;max-width:520px;height:100%;margin:0 auto;display:flex;flex-direction:column}
#lph{padding:10px 12px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #0006}
#lph h2{font:600 18px Palatino,Georgia,serif;margin:0 auto 0 0}
#lph button,#lpf button{font:600 12px system-ui;padding:5px 9px;border-radius:7px;border:0;background:var(--t2);color:var(--ink)}
#lph button.on,#lpf button.on{background:#e2b24c;color:#1b1b1b}
#lpf{padding:6px 12px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--dim)}
#lpb{flex:1;overflow:auto;padding:4px 12px 16px;font-size:12.5px;line-height:1.45}
#lpb .tn{margin:10px 0 3px;padding:3px 6px;background:#0004;border-left:3px solid #888;color:var(--ink);font-weight:600}
#lpb .tn.P{border-color:#4ea5cc}#lpb .tn.E{border-color:#cc6150}
#lpb .ln{padding:1px 0 1px 8px;color:var(--dim)}
#lpb .ln b{color:var(--ink)}#lpb .P{color:#6fb9dd}#lpb .E{color:#e07d6c}
#lpb .ln.dmg{color:#e8c9b8}#lpb .ln.heal{color:#b7e3c2}#lpb .ln.death{color:#ff9a8a;font-weight:600}#lpb .ln.status{color:#cdbff0}
#lpb table{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:12px}
#lpb th,#lpb td{padding:3px 5px;text-align:right;border-bottom:1px solid #0004}#lpb th:first-child,#lpb td:first-child{text-align:left}
#lpb th{color:var(--dim);font-weight:600;position:sticky;top:0;background:var(--panel)}
#lpb h3{font:600 14px Palatino,Georgia,serif;margin:12px 0 2px;color:var(--ink)}
#log{color:var(--dim);font-size:13px;min-height:3.9em}
#log div:first-child{color:var(--ink)}
#over,#setup{position:fixed;inset:0;background:#000d;display:none;place-items:center;overflow:auto;padding:12px}
#over>div,#setup>div{background:var(--panel);padding:20px;border-radius:12px;text-align:center;width:100%;max-width:420px}
#over h2,#setup h2{font:600 22px Palatino,Georgia,serif;margin:0 0 12px}
#setup{display:grid}#setup h3{font:600 14px Palatino,Georgia,serif;margin:0 0 6px;color:var(--dim)}
.cmd small{color:var(--gold)}
.sub{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:8px;border-left:3px solid var(--gold)}
.fld{display:block;font-size:12px;color:var(--dim);margin-top:6px}
.pk{width:100%;margin-top:2px}
.pkl{display:grid;gap:6px;margin-top:6px;padding-left:8px;border-left:3px solid var(--gold)}
.pkl button{width:100%}
.chip.cast{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#3b2f5a;border-style:dashed;color:#d6c2ff;line-height:1}
.chip.cast small{font-size:9px;color:var(--ink)}
.card{background:var(--t1);border-radius:8px;padding:8px;margin-bottom:8px;text-align:left}
.card select{margin-bottom:0}
details summary{color:var(--dim);font-size:13px;padding:6px 0 2px}
label{display:block;font-size:12px;color:var(--dim);margin-top:6px}
label select{margin-top:2px;margin-bottom:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
select{background:var(--t2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;width:100%;margin-bottom:8px}

/* ---- Full-screen battle (UI pass, FFT style): the board fills the screen and the HUD floats over it. ---- */
:root{--frame:rgba(16,24,34,.93);--fline:rgba(226,178,76,.55);--padT:108px;--padB:300px;--padL:0px;--padR:0px}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:block}
#app{position:fixed;inset:0;max-width:none;width:auto;padding:0;display:block;pointer-events:none}
#app>*{pointer-events:auto}
.fr,#bar,#obj,#info,#top>span{background:var(--frame);border:1px solid var(--fline);border-radius:7px;box-shadow:inset 0 0 0 2px rgba(12,19,27,.9),inset 0 0 0 3px rgba(226,178,76,.18),0 4px 14px rgba(0,0,0,.45)}
#bwo{position:absolute;inset:0;z-index:0}
#bw{position:absolute;inset:0;max-height:none;overflow:auto;overscroll-behavior:contain;scrollbar-width:none}#bw::-webkit-scrollbar{display:none}
#bwi{display:flex;min-width:100%;min-height:100%;width:max-content;padding:calc(var(--padT) + env(safe-area-inset-top)) var(--padR) calc(var(--padB) + env(safe-area-inset-bottom)) var(--padL)}
#cv{margin:auto;flex:none}
#top{position:absolute;z-index:7;top:calc(6px + env(safe-area-inset-top));right:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
#top h1{display:none}
#mnb{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;justify-content:center;font:700 18px system-ui;background:var(--frame);border-color:var(--fline)}
#top>span{display:none;flex-direction:column;align-items:stretch;gap:6px;padding:6px;max-width:220px}
#top.open>span{display:flex}
#top>span button{min-height:38px;justify-content:center;white-space:normal;text-align:center}
#bar{position:absolute;z-index:6;top:calc(6px + env(safe-area-inset-top));left:8px;max-width:calc(100% - 66px);padding:4px 6px;gap:4px;align-items:center}
#bar:empty{display:none}
.chip{width:34px;height:34px;overflow:hidden;padding:0;font-size:12px}
.chip img{display:block;width:100%;height:100%}
.chip.now{width:40px;height:40px;background:var(--gold);box-shadow:0 0 8px rgba(226,178,76,.8)}
.chip.again{margin-left:7px;overflow:visible}.chip.again::after{left:-7px;top:2px;bottom:2px}
.chip.again img{border-radius:4px}
#obj{position:absolute;z-index:6;top:calc(56px + env(safe-area-inset-top));left:8px;padding:3px 9px;min-height:0;font-size:11.5px}
#obj:empty{display:none}
#log{position:absolute;z-index:5;top:calc(84px + env(safe-area-inset-top));left:10px;right:60px;min-height:0;pointer-events:none;font-size:12px;text-shadow:0 1px 2px #000,0 0 4px #000}
#log div:not(:first-child){display:none}
.zm{position:absolute;z-index:6;top:calc(112px + env(safe-area-inset-top));right:8px;display:flex;flex-direction:column;gap:7px}
.zm button,.zm .vt,.zm .rot{position:static;width:40px;height:40px;min-width:0;border-radius:50%;border:1px solid var(--fline);background:rgba(16,24,34,.82);color:var(--ink);font:700 17px system-ui;padding:0;display:grid;place-items:center}
.zm .vt{font-size:12px}
#hud{position:absolute;z-index:5;left:0;right:0;bottom:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,200px);grid-template-areas:"hint hint" "cards info";gap:6px;align-items:end;padding:28px 6px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(rgba(12,19,27,0),rgba(12,19,27,.88) 34px);pointer-events:none}
#hud>*{pointer-events:auto}
#hint{grid-area:hint;font-size:12px;line-height:1.3;color:#d5dde3;text-shadow:0 1px 2px #000;min-height:0;padding:0 2px}
#hint:empty{display:none}
#cards{grid-area:cards;display:flex;flex-direction:column;gap:5px;min-width:0}
#cards .uc.empty{display:none}
.uc{border-color:var(--fline);background:linear-gradient(100deg,rgba(22,34,47,.95),rgba(30,48,64,.95));padding:5px}
.uc.E{background:linear-gradient(100deg,rgba(42,28,30,.95),rgba(70,40,42,.95))}
.uc .pt{flex-basis:56px;width:56px;height:56px}
#info{grid-area:info;padding:6px;gap:5px;max-height:calc(100vh - var(--padT) - 20px - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto}
#who{font-size:12px;gap:6px;padding:0 2px 5px;border-bottom:1px solid rgba(226,178,76,.25)}
#who>span:first-child small{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
#who .pips{flex-wrap:nowrap;gap:3px}#who .pip{width:11px;height:11px;border-width:2px}
#who button.a.tb{padding:6px 10px;font-size:13px}
#acts{display:flex;flex-direction:column;gap:3px}
#acts button.a{min-height:38px;padding:5px 8px;border-radius:5px;background:transparent;border-color:transparent;font:600 15px Palatino,Georgia,serif}
#acts button.a small{font:10.5px/1.2 system-ui}
#acts button.a b{font:700 11px system-ui;padding:1px 7px}
#acts button.a.sel{background:rgba(226,178,76,.16);border-color:var(--gold);box-shadow:none}
#acts button.a:not(.dis):not(.cf):active{background:rgba(226,178,76,.1)}
#acts button.a.back{border-bottom:1px solid rgba(226,178,76,.3);border-radius:5px 5px 0 0;color:var(--gold);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
#acts button.a.rep{border-color:rgba(226,178,76,.35);background:rgba(58,58,42,.6)}
#acts button.a.cf{justify-content:center;font-family:system-ui}
#acts button.a.cf{background:var(--ally);border-color:var(--ally)}#acts button.a.cf.no{background:var(--t2);border-color:var(--line)}
#acts button.end{background:var(--ally)}
#cards .pred{background:var(--frame);border-color:var(--fline)}
#app.placing{--padB:330px}
#app.confirming #hud{grid-template-columns:minmax(0,1fr);grid-template-areas:"hint" "cards" "info"}
#app.confirming #cards{display:grid;grid-template-columns:1fr 1fr}
#app.confirming #cards>.pred,#app.confirming #cards>.uc.empty+*{grid-column:1/-1}
#app.confirming #acts{display:grid;grid-template-columns:1fr 1fr}
#app.placing #hud{grid-template-columns:minmax(0,1fr);grid-template-areas:"hint" "cards" "info"}
#app.placing #acts{display:grid;grid-template-columns:1fr 1fr 1fr}
#app.placing #acts button.a{background:var(--t2);border-color:var(--line);justify-content:center;font:600 13px system-ui}
#app.placing #acts button.end{background:var(--ally)}
@media (orientation:landscape){
  :root{--padT:52px;--padB:8px;--padL:236px;--padR:236px}
  #hud{grid-template-columns:228px minmax(0,1fr) 228px;grid-template-areas:"cards hint info";background:none;padding-top:0}
  #hint{align-self:end;text-align:center;padding-bottom:4px}
  .zm{top:calc(6px + env(safe-area-inset-top));right:56px;flex-direction:row}
  #bar{max-width:calc(100% - 340px)}
  #log{right:auto;max-width:40%;left:auto;right:300px;text-align:right;top:calc(56px + env(safe-area-inset-top))}
  #info{max-height:calc(100vh - 60px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  #app.confirming #hud{grid-template-columns:228px minmax(0,1fr) 228px;grid-template-areas:"cards hint info"}
  #app.confirming #cards{display:flex}
  #app.confirming #acts{display:flex}
  #app.placing #hud{grid-template-columns:minmax(0,300px) minmax(0,1fr) 228px;grid-template-areas:"cards hint info"}
  #app.placing #acts{grid-template-columns:1fr}
  #app.placing{--padB:8px}
}

</style>

<div id="app">
  <div id="top"><h1>Tactics Prototype</h1><button class="a sm" id="mnb" aria-label="Battle menu" data-d="Menu: effects, the combat log and leaving the battle." onclick="this.parentNode.classList.toggle('open')">⋯</button><span><button class="a sm" id="fxb" onclick="this.textContent=FX.cycle()">FX</button> <button class="a sm" onclick="openLog()">Log</button> <button class="a sm skirm" onclick="showSetup()">Parties</button></span></div>
  <div id="bar"></div>
  <div id="obj"></div>
  <div id="bwo"><div id="bw"><div id="bwi"><canvas id="cv"></canvas></div></div></div>
  <div class="zm">
    <button class="vt" id="vtb" data-d="Switch between the angled 3D view and a flat top-down view. Top-down shows heights as shading and numbers, and nothing can hide behind a hill." onclick="toggleView()">3D</button>

// Charge-time turn order: meters fill by Speed; the first to reach 100 acts.
// Next event = a unit's turn meter reaching the threshold, or a pending cast finishing (casts win ties).
const evSort=(a,b)=>(Math.abs(a.t-b.t)>1e-9?a.t-b.t:0)||a.p-b.p||a.team-b.team;
function advance(){
  for(let i=0;i<200;i++){
    const evs=[];
    for(const u of alive()){
      evs.push({t:Math.max(0,(CR.turn.meterThreshold-u.meter)/sp(u)),p:1,team:u.team==='P'?0:1,u});
      if(u.cast)evs.push({t:Math.max(0,(u.cast.need-u.cast.meter)/sp(u)),p:0,team:0,u,cast:true});
    }
    evs.sort(evSort);const e=evs[0];
    alive().forEach(u=>{const d=e.t*sp(u);u.meter+=d;if(u.cast)u.cast.meter+=d});
    if(!e.cast)return e.u;
    resolveCast(e.u);
    if(over)return null;
  }
  return null;
}
function nextTurn(){
  const best=advance();
  if(!best){render();return}
  TURN++;CUR=null;active=best;if(best.baseTeam==='P'){PT++;if(OBJ&&OBJ.type==='hold'&&PT>1&&(PT-1)%NP===0)holdTick();if(HZ&&PT>1&&(PT-1)%NP===0){hzRound();checkEnd()}}
  active.team=active.baseTeam;active.guard=false;active.hasMovedThisTurn=false;active.movedAny=false;active.tf={};active.usedAb=new Set();active.armed=[];active.pulled=null;spent=0;bonus=active.charge*CR.charge.bonusPointsPerCharge+(active.apBonus||0);mode=null;menu=null;inspect='';FOCUS=null;
  if(active.st.charm>0)active.team=active.baseTeam==='P'?'E':'P'; // charmed: fights for the other team during its own turn
  for(const k of TICK){ // start of own turn: poison/bleed/burn hurt, regen heals
    const p=active.st[k];if(!p)continue;
    const prev=active.hp,nInst=LO.dotInsts(p).length;let tick=0;
    if(CR.statuses[k].negative){tick=Math.min(prev,LO.dotInsts(p).reduce((s,i)=>s+i.d,0));active.hp=Math.max(0,prev-tick);if(window.FX&&tick>0)FX.num(active,tick,{dot:k});say(`${active.n} takes ${tick} ${k}`+(nInst>1?` (${nInst} stacks)`:''),{dup:1});EV({ev:'dot',tgt:active.n,tt:tm(active),status:k,amt:tick,left:p.n-1,hp0:prev,hp1:active.hp})}
    else{const want=Math.round(LO.dotInsts(p).reduce((s,i)=>s+i.d,0)*LO.healMult(active)),h=Math.min(want,active.max-active.hp);active.hp+=h;if(window.FX&&h>0)FX.num(active,h,{regen:1});say(`${active.n} regenerates ${h}`,{dup:1});EV({ev:'heal',src:active.n,st:tm(active),tgt:active.n,tt:tm(active),ab:k,amt:h,over:want-h,hp0:prev,hp1:active.hp})}
    if(LO.dotAdvance(p)){active.st[k]=null;EV({ev:'expire',tgt:active.n,tt:tm(active),status:k});fire('onStatusExpired',active,{status:k})}
    if(active.hp<=0){onDeath(active,null,k);break}
    checkBloodied(active,prev);
  }
  if(HZ&&active.hp>0&&!over)hzTurn(active);
  checkEnd();
  if(active.hp<=0){if(!over)nextTurn();else render();return}
  say(`${active.n}'s turn`+(active.st.charm>0?' (charmed)':''));EV({ev:'turn',actor:active.n,tt:tm(active),hp:active.hp,max:active.max,ap:apNow()+bonus,stat:stText(active)});
  active.mana=Math.min(active.manaMax,active.mana+active.manaRegen+LO.manaRegenBonus(active)); // mana trickles back at the start of your turn
  fire('onTurnStart',active,{});checkEnd();
  if(!over&&active.hp>0&&active.st.fear>0)fleeMove(active);
  if(over){render();return}
  render();
  if(skipsTurn(active)){skipTurn(active);return}
  if(isAI(active))ai();
}
async function skipTurn(u){ // stun: the unit loses its turn (no onTurnEnd triggers)
  busy=true;say(`${u.n} is stunned and loses the turn`);EV({ev:'skip',actor:u.n,tt:tm(u)});render();
  await sleep(CR.ai.thinkDelayMs);
  busy=false;if(!over&&active===u)endTurn(true);
}
function endTurn(skipped){
  if(over)return;
  if(!skipped){fire('onTurnEnd',active,{});checkEnd();if(over){render();return}}
  const used=Math.min(bonus,Math.max(0,spent-apNow())); // bonus points are spent last
  active.charge=Math.max(0,active.charge-Math.ceil(used/CR.charge.bonusPointsPerCharge));
  for(const k of DEC)if(active.st[k]>0&&--active.st[k]<=0){EV({ev:'expire',tgt:active.n,tt:tm(active),status:k,hid:k==='vanish'&&hidE(active)});fire('onStatusExpired',active,{status:k})}
  for(const k in active.cd)if(active.cd[k]>0)active.cd[k]--;
  active.team=active.baseTeam; // charm only lasts through its own turn
  active.meter=-spent*CR.turn.meterPenaltyPerPointSpent+(active.meterBank||0);active.meterBank=0;nextTurn();
}

const jumpDelta=u=>{let d=0;if(u&&u.st)for(const k in u.st)if(u.st[k]>0&&CR.statuses[k]&&CR.statuses[k].jumpDelta)d+=CR.statuses[k].jumpDelta;return d};
const jumpOf=(u,extra=0)=>(u.jump||CR.height.defaultClimb)+jumpDelta(u)+extra;
const zocPenalty=u=>alive().some(f=>f.team!==u.team&&f.st.zoc>0&&dist(f,u)===1)?CR.statuses.zoc.zocRangePenalty:0; // enemy Zone of Control
const moveRange=u=>Math.max(1,u.mv-zocPenalty(u)+LO.moveMod(u));
function reach(u,mv=moveRange(u),jb=0,av=null){ // av: tiles to path around (the AI avoids live hazards)
  const prev=new Map([[u.x+','+u.y,null]]),dd=new Map([[u.x+','+u.y,0]]),q=[[u.x,u.y]],out=new Map();
  while(q.length){
    const [x,y]=q.shift(),k0=x+','+y,d=dd.get(k0);
    if(d>=mv)continue;
    for(const [nx,ny] of nbrs(x,y)){
      const k=nx+','+ny;
      if(!inb(nx,ny)||dd.has(k)||ROCKS.includes(k)||(av&&av.has(k))||Math.abs(ht(nx,ny)-ht(x,y))>jumpOf(u,jb))continue;
      const o=at(nx,ny);
      if(o&&o.team!==u.team)continue; // enemies block, allies can be passed through
      dd.set(k,d+1);prev.set(k,k0);q.push([nx,ny]);
      if(!o){const path=[];for(let c=k;c!==null;c=prev.get(c))path.unshift(c.split(',').map(Number));out.set(k,path.slice(1))}
    }
  }

  const U={},A={},get=(n,t)=>U[n]||(U[n]={n,t,dealt:0,taken:0,abs:0,heal:0,recv:0,over:0,kills:0,deaths:0,ap:0,casts:0});
  for(const e of LOG){if(!LPREV&&e.hid)continue;
    if(e.ev==='dmg'){const a=get(e.src,e.st),b=get(e.tgt,e.tt);a.dealt+=e.hp;b.taken+=e.hp;b.abs+=e.shield+e.icpt;const k=e.ab||'—',r=A[k]||(A[k]={k,uses:0,hits:0,dmg:0,heal:0,cast:0});r.hits++;r.dmg+=e.hp}
    else if(e.ev==='dot'||e.ev==='hazard')get(e.tgt,e.tt).taken+=e.amt;
    else if(e.ev==='heal'){const a=get(e.src,e.st||e.tt),b=get(e.tgt,e.tt);a.heal+=e.amt;b.recv+=e.amt;a.over+=Math.max(0,e.over||0);const k=e.ab||'—',r=A[k]||(A[k]={k,uses:0,hits:0,dmg:0,heal:0});r.heal+=e.amt}
    else if(e.ev==='death'){get(e.tgt,e.tt).deaths++;if(e.src)get(e.src,e.st).kills++}
    else if(e.ev==='ab'){const a=get(e.actor,e.tt);a.ap+=e.cost;a.casts++;const r=A[e.ab]||(A[e.ab]={k:e.ab,uses:0,hits:0,dmg:0,heal:0});r.uses++}
    else if(e.ev==='move')get(e.actor,e.tt).ap+=e.dash?0:e.cost;
  }
  return{U:Object.values(U),A:Object.values(A)};
}
function drawLog(){
  if(!LOGOPEN)return;
  const f=$('lpf'),b=$('lpb'),cats=[['all','All'],['dmg','Damage'],['heal','Healing'],['status','Status'],['move','Moves'],['act','Actions'],['death','Deaths']];
  const hidN=LOG.filter(e=>e.hid).length;
  f.innerHTML=(LPTAB==='L'?cats.map(([k,l])=>`<button class="${LPF===k?'on':''}" onclick="LPF='${k}';drawLog()">${l}</button>`).join(''):'')+
    `<label style="margin-left:auto"><input type="checkbox" ${LPREV?'checked':''} onchange="LPREV=this.checked;drawLog()"> reveal hidden${hidN?' ('+hidN+')':''}</label>`+
    `<button onclick="copyLog()">Copy</button><button onclick="dlLog('txt')">.txt</button><button onclick="dlLog('json')">.json</button>`;
  $('tabL').className=LPTAB==='L'?'on':'';$('tabS').className=LPTAB==='S'?'on':'';
  const keep=b.scrollHeight-b.scrollTop-b.clientHeight<40;
  if(LPTAB==='L'){
    let out='';
    for(const e of LOG){if(!lpVisible(e))continue;const x=fmtEv(e);if(LPF!=='all'&&x.cat!==LPF&&x.cat!=='turn')continue;out+=`<div class="${x.cls}">${x.h}</div>`}
    b.innerHTML=out||'<div class="ln">Nothing yet.</div>';
    if(keep)b.scrollTop=b.scrollHeight;
  }else{
    const {U,A}=lpStats(),r1=n=>Math.round(n*10)/10;
    const row=u=>`<tr><td><b class="${u.t}">${u.n}</b></td><td>${u.dealt}</td><td>${u.taken}</td><td>${u.abs}</td><td>${u.heal}</td><td>${u.recv}</td><td>${u.over}</td><td>${u.kills}</td><td>${u.deaths}</td><td>${u.ap}</td></tr>`;
    b.innerHTML=`<h3>Units</h3><table><tr><th>Unit</th><th title="HP damage dealt">Dmg</th><th title="HP lost">Taken</th><th title="Absorbed by shield or intercept">Abs</th><th title="Healing done">Heal</th><th title="Healing received">Recv</th><th title="Overheal wasted">Over</th><th title="Kills">K</th><th title="Times downed">D</th><th title="AP spent">AP</th></tr>${U.sort((a,b)=>(a.t>b.t?-1:1)||b.dealt-a.dealt).map(row).join('')}</table>`+
      `<h3>Abilities</h3><table><tr><th>Ability</th><th>Uses</th><th>Hits</th><th>Damage</th><th>Avg/hit</th><th>Heal</th></tr>${A.sort((a,b)=>b.uses-a.uses||b.dmg-a.dmg).map(a=>`<tr><td>${abn(a.k)||a.k}</td><td>${a.uses||''}</td><td>${a.hits||''}</td><td>${a.dmg||''}</td><td>${a.hits?r1(a.dmg/a.hits):''}</td><td>${a.heal||''}</td></tr>`).join('')}</table>`+
      `<div class="ln">Dmg/Taken count HP only. Abs = shield + intercepted. Over = wasted healing. K/D = kills/downs. AP = ability and move cost. Damage-over-time counts as taken, not dealt.</div>`;
  }
}
const logText=()=>LOG.filter(lpVisible).map(e=>{const x=fmtEv(e);return(x.cat==='turn'?'\n':'  ')+x.t}).join('\n');
function openLog(){LOGOPEN=true;$('logp').style.display='block';drawLog()}
function closeLog(){LOGOPEN=false;$('logp').style.display='none'}
function lpTab(t){LPTAB=t;drawLog()}
function copyLog(){const t=logText();try{navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(_){}a.remove()}}
function dlLog(kind){const blob=new Blob([kind==='json'?JSON.stringify(LOG,null,1):logText()],{type:kind==='json'?'application/json':'text/plain'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='combat-log.'+kind;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
</script>
